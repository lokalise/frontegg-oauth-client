name: Release

on:
  push:
    branches:
      - main
  repository_dispatch:
    types:
      - release

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions: {}

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout
        # zizmor: ignore[artipacked] changesets/action needs the persisted token to push the changeset-release branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.x
          registry-url: 'https://registry.npmjs.org'
          scope: '@lokalise'
          cache: 'pnpm'

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Create Release Pull Request or Publish
        id: changesets
        uses: changesets/action@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          publish-script: pnpm run ci:publish
          pr-title: 'Release Packages'
          commit-message: 'chore: update versions'
          github-token: ${{ secrets.GITHUB_TOKEN }}
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      # BOT_ACCESS_TOKEN merges regardless of approval/checks (the PR opened with
      # GITHUB_TOKEN gets no checks). The dispatch starts the publish run.
      - name: Merge Release Packages PR
        if: steps.changesets.outputs.pr-number != ''
        run: |
          gh pr merge --squash "$PR_NUMBER"
          gh api --method POST "/repos/$REPO/dispatches" -f 'event_type=release'
        env:
          GH_TOKEN: ${{ secrets.BOT_ACCESS_TOKEN }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ steps.changesets.outputs.pr-number }}
