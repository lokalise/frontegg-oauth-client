name: Release

on:
  push:
    branches:
      - main
  repository_dispatch:
    types:
      - release

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Release
    permissions:
      id-token: write
      contents: write
      pull-requests: write
    uses: lokalise/github-actions/.github/workflows/changesets-release.yml@stable # zizmor: ignore[unpinned-uses] org-controlled reusable, pinned to @stable by policy
    with:
      node-version: 24.x
      npm-scope: '@lokalise'
      publish-command: pnpm run ci:publish
      pr-title: 'Release Packages'
      commit-message: 'chore: update versions'
      # BOT_ACCESS_TOKEN merges regardless of approval/checks and fires the
      # release dispatch that starts the publish run.
      auto-merge: true
      runner: ubuntu-latest
    secrets:
      github-token: ${{ secrets.GITHUB_TOKEN }}
      merge-token: ${{ secrets.BOT_ACCESS_TOKEN }}
      npm-token: ${{ secrets.NPM_TOKEN }}
