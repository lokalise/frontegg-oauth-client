name: PR Checks
on: pull_request

jobs:
  pr-checks-build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24.x
          cache: "pnpm"
      - name: Install Dependencies
        run: pnpm install --frozen-lockfile
      - name: Build Package
        run: pnpm run build
  pr-checks-code-lint:
    name: Code Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24.x
          cache: "pnpm"
      - name: Install Dependencies
        run: pnpm install --frozen-lockfile
      - name: Run Code Linting
        run: pnpm run lint
  pr-checks-tests:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24.x
          cache: "pnpm"
      - name: Install Dependencies
        run: pnpm install --frozen-lockfile
      - name: Run Tests
        run: pnpm run test

  changeset-check:
    # Skip for PRs labelled `skip-release` (Dependabot applies this label to every
    # PR it opens). The action skips the changesets "Release Packages" PR itself.
    if: ${{ github.event_name == 'pull_request' && !contains(github.event.pull_request.labels.*.name, 'skip-release') }}
    runs-on: ubuntu-latest
    name: Changed public packages have changesets
    steps:
      # Fails when the package changed since the base branch and no changeset covers it.
      # Use an empty changeset (`pnpm changeset --empty`) for changes that must not release.
      - name: Check changesets for changed public packages
        uses: lokalise/github-actions/changeset-check@stable # zizmor: ignore[unpinned-uses] org-controlled reusable, pinned to @stable by policy

  automerge:
    needs: pr-checks-tests
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      contents: write
    steps:
      - uses: fastify/github-action-merge-dependabot@v3
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
